name: "Changelog Check"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  
# Minimal permissions: read repo content, comment on PRs, make Copilot requests
permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  changelog:
    name: "Changelog Check"
    runs-on: ubuntu-slim
    # Skip PRs explicitly labelled as not needing a changelog entry
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Check if CHANGELOG.md was modified"
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null \
              | grep -qx 'CHANGELOG.md'; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "✅ CHANGELOG.md was updated in this PR — no suggestion needed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  CHANGELOG.md was NOT updated in this PR."
          fi

      - name: "Set up Python"
        if: steps.check.outputs.changed == 'false'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: "Build changelog prompt"
        if: steps.check.outputs.changed == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER:    ${{ github.event.pull_request.number }}
          PR_TITLE:     ${{ github.event.pull_request.title }}
          PR_BODY:      ${{ github.event.pull_request.body }}
          REPO:         ${{ github.repository }}
        run: python3 .github/scripts/generate_changelog_suggestion.py build-prompt

      - name: "Set up Node.js"
        if: steps.check.outputs.changed == 'false'
        uses: actions/setup-node@v7

      - name: "Install Copilot CLI"
        if: steps.check.outputs.changed == 'false'
        run: npm install -g @github/copilot

      - name: "Generate changelog suggestion"
        id: inference
        if: steps.check.outputs.changed == 'false'
        continue-on-error: true
        uses: actions/ai-inference@v3
        with:
          model: gpt-4.1
          system-prompt-file: ${{ runner.temp }}/changelog_system_prompt.txt
          prompt-file: ${{ runner.temp }}/changelog_user_prompt.txt
        env:
          # Copilot CLI auth: PAT with the "Copilot Requests" permission.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: "Post changelog suggestion"
        if: steps.check.outputs.changed == 'false' && steps.inference.outputs.response-file != ''
        env:
          GITHUB_TOKEN:  ${{ github.token }}
          PR_NUMBER:     ${{ github.event.pull_request.number }}
          REPO:          ${{ github.repository }}
          RESPONSE_FILE: ${{ steps.inference.outputs.response-file }}
        run: python3 .github/scripts/generate_changelog_suggestion.py post-comment
