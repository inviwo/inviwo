name: "Changelog Check"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Minimal permissions: read repo content, comment on PRs, run Copilot inference
permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  changelog:
    name: "Changelog Check"
    runs-on: ubuntu-latest
    # Skip PRs explicitly labelled as not needing a changelog entry
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Check if CHANGELOG.md was modified"
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null \
              | grep -qx 'CHANGELOG.md'; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "✅ CHANGELOG.md was updated in this PR — no suggestion needed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  CHANGELOG.md was NOT updated in this PR."
          fi

      - name: "Prepare prompt inputs"
        id: prep
        if: steps.check.outputs.changed == 'false'
        env:
          GH_TOKEN:  ${{ github.token }}
          PR_TITLE:  ${{ github.event.pull_request.title }}
          PR_BODY:   ${{ github.event.pull_request.body }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          # Fetch and truncate the PR diff (14 KB limit)
          gh pr diff ${{ github.event.pull_request.number }} 2>/dev/null \
            | head -c 14000 > /tmp/pr.diff
          echo "... (diff truncated for brevity)" >> /tmp/pr.diff

          # First 3000 chars of CHANGELOG.md for style reference
          CHANGELOG_HEAD=$(head -c 3000 CHANGELOG.md 2>/dev/null || echo "(CHANGELOG.md not found)")

          # Build the full user-prompt as a plain text file.
          # Using printf + cat avoids any YAML parsing of PR content.
          {
            printf 'Today: %s\n\n' "$TODAY"
            printf 'PR title: %s\n\n' "${PR_TITLE:-}"
            printf 'PR description:\n%s\n\n' "${PR_BODY:-(none)}"
            printf 'Code diff:\n```diff\n'
            cat /tmp/pr.diff
            printf '\n```\n\n'
            printf 'Existing CHANGELOG.md (style reference only):\n%s\n\n' "$CHANGELOG_HEAD"
            printf 'Write a suitable CHANGELOG.md entry for this PR.'
          } > /tmp/prompt.txt

      - name: "Generate suggestion and post comment"
        if: steps.check.outputs.changed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- changelog-suggestion-bot -->';

            // Read prompt files
            const prompt = fs.readFileSync('/tmp/prompt.txt', 'utf8');
            const systemPrompt = fs.readFileSync('.github/prompts/changelog-suggestion-system.txt', 'utf8');

            // Call Copilot chat completions API (requires copilot-requests: write)
            let suggestion = '(no suggestion generated)';
            try {
              const resp = await fetch('https://api.githubcopilot.com/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `******
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'gpt-4.1',
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user',   content: prompt },
                  ],
                }),
              });
              if (resp.ok) {
                const data = await resp.json();
                suggestion = data.choices?.[0]?.message?.content ?? suggestion;
              } else {
                core.warning(`Copilot API returned ${resp.status}: ${await resp.text()}`);
              }
            } catch (err) {
              core.warning(`Failed to call Copilot API: ${err.message}`);
            }

            const body = [
              marker,
              '## 📝 Suggested `CHANGELOG.md` entry',
              '',
              '`CHANGELOG.md` was not updated in this PR. Based on the diff, here is a suggested entry — add it at the **top** of `CHANGELOG.md` if appropriate:',
              '',
              '```markdown',
              suggestion,
              '```',
              '',
              '<details>',
              '<summary>ℹ️ About this suggestion</summary>',
              '',
              'This entry was generated automatically by analysing the PR diff with an AI model.',
              'Please review it carefully; it may need adjustments to accurately reflect the intent of the changes.',
              '',
              '**When a changelog entry is required:** changes that affect the public C++/Python API,',
              'behaviour visible to other module authors, or anything that requires a migration step.',
              '',
              '**When it can be skipped:** pure internal refactors, test-only changes, documentation',
              'fixes, or CI tweaks. Add the `no-changelog` label to this PR to silence this bot.',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing bot comment #${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Posted new bot comment.');
            }
